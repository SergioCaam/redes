<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nada</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            /* Fondo: Pastel azul verdoso saturado (Mint) */
            background-color: #A3E4D7; 
            font-family: 'Verdana', sans-serif;
            color: #2C3E50; /* Texto oscuro mate */
        }

        /* --- ARRIBA (Contacto) --- */
        header {
            text-align: center;
            padding-top: 30px;
            width: 100%;
        }

        h1 {
            font-size: 1.5em;
            margin: 0;
            /* Color: Azul oscuro mate */
            color: #2C3E50; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .contact-link {
            /* Color: Rojo/Rosa pastel saturado */
            color: #E74C3C; 
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 8px;
            display: inline-block;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .contact-link:hover {
            border-bottom: 2px solid #E74C3C;
            transform: scale(1.05);
        }

        /* --- CENTRO (La Cita) --- */
        .main-content {
            text-align: center;
            width: 80%;
            max-width: 800px;
        }

        .quote {
            font-size: 6em;
            font-weight: 900;
            color: #FFFFFF; 
            letter-spacing: -4px;
            margin: 0;
            text-shadow: 4px 4px 0px #1ABC9C; 
        }

        .author {
            font-size: 1.8em;
            color: #34495E; 
            margin-top: 20px;
            font-style: italic;
            font-weight: bold;
            
            /* EL TRUCO DE LA ALINEACIÓN */
            text-align: right; /* Alinea el texto a la derecha */
            margin-right: 25%; /* Lo empuja un 25% hacia el centro para que no toque el borde */
            display: block;
        }

        /* --- ABAJO (Footer) --- */
        footer {
            margin-bottom: 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2C3E50;
            margin-bottom: 15px;
            font-weight: bold;
            opacity: 0.7;
        }

        /* Botón estilo "Flat" saturado */
        .dns-button {
            /* Fondo: Naranja coral saturado */
            background-color: #E67E22; 
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.2em;
            border-bottom: 5px solid #D35400; /* Efecto 3D mate */
            transition: all 0.1s;
            display: inline-block;
        }

        .dns-button:active {
            border-bottom: 0px solid #D35400;
            transform: translateY(5px);
        }

        .dns-button:hover {
            background-color: #F39C12;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sergio Caamaño Novo</h1>
        <a href="mailto:s.cnovo@udc.es" class="contact-link">s.cnovo@udc.es</a>
    </header>

    <div class="main-content">
        <div class="quote">"Nada"</div>
        <div class="author">- Un pez</div>
    </div>

    <footer>
        <h2>Hosting Provider</h2>
        <a href="https://freedns.afraid.org" class="dns-button">FREE DNS</a>
    </footer>

</body>
</html>
